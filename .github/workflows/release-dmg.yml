name: Release DMG

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Semver component to increment
        type: choice
        options: [auto, patch, minor, major]
        default: auto

concurrency:
  group: release-dmg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  dmg:
    # A release tags the pushed commit. It does not push another commit.
    # [skip ci] still skips a release when someone needs a push with no tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Use HTTPS for Swift package GitHub URLs
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Select latest Xcode
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          if [ -z "$xcode" ]; then
            echo "No Xcode.app found" >&2
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
          swift --version | grep -E 'Swift version 6\.([2-9]|[1-9][0-9])' >/dev/null
          echo "Using $xcode"

      - name: Test
        run: ./scripts/test.sh

      - name: Next version
        id: version
        run: |
          set -euo pipefail
          git fetch --tags --force
          bump="${{ github.event.inputs.bump || 'auto' }}"
          if ! parsed="$(./scripts/next-version.sh "$bump")"; then
            status=$?
            if [ "$status" -eq 2 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No new commits to release"
              exit 0
            fi
            exit "$status"
          fi
          echo "$parsed"
          eval "$parsed"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $ver" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $ver" Info.plist
          {
            echo "ver=$ver"
            echo "tag=$tag"
            echo "prev=${prev:-}"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (bump=$bump, previous=${prev:-none})"

      - name: Load signing certificate
        if: steps.version.outputs.skip != 'true'
        env:
          JFRED_CODESIGN_P12_BASE64: ${{ secrets.JFRED_CODESIGN_P12 }}
          JFRED_CODESIGN_PASSWORD: ${{ secrets.JFRED_CODESIGN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$JFRED_CODESIGN_P12_BASE64" ] || [ -z "$JFRED_CODESIGN_PASSWORD" ]; then
            echo "JFRED_CODESIGN_P12 and JFRED_CODESIGN_PASSWORD must be set" >&2
            exit 1
          fi
          p12="$RUNNER_TEMP/jfred-codesign.p12"
          printf '%s' "$JFRED_CODESIGN_P12_BASE64" | base64 --decode > "$p12"
          echo "JFRED_CODESIGN_P12=$p12" >> "$GITHUB_ENV"
          echo "JFRED_CODESIGN_PASSWORD=$JFRED_CODESIGN_PASSWORD" >> "$GITHUB_ENV"
          echo "JFRED_CODESIGN_REQUIRED=1" >> "$GITHUB_ENV"

      - name: Build DMG
        if: steps.version.outputs.skip != 'true'
        run: ./scripts/package-dmg.sh --ci

      - name: Tag and publish GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          prev="${{ steps.version.outputs.prev }}"
          dmg="$(ls dist/Jfred-*.dmg)"
          notes="${RUNNER_TEMP}/release-notes.md"
          ver="${{ steps.version.outputs.ver }}"
          if python3 ./scripts/changelog-notes.py "$ver" > "$notes"; then
            if [ -n "$prev" ]; then
              printf '\n**Full Changelog**: https://github.com/%s/compare/%s...%s\n' "$GITHUB_REPOSITORY" "$prev" "$tag" >> "$notes"
            fi
          else
            {
              echo "## What's Changed"
              if [ -n "$prev" ]; then
                git log --pretty=format:'- %s' "${prev}..HEAD"
              else
                git log --pretty=format:'- %s'
              fi | sed 's/\.$//'
              echo
              echo
              if [ -n "$prev" ]; then
                echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
              fi
            } > "$notes"
            if ! grep -q '^- ' "$notes"; then
              subject="$(git log -1 --pretty=format:'%s' | sed 's/\.$//')"
              {
                echo "## What's Changed"
                echo "- ${subject}"
                echo
                if [ -n "$prev" ]; then
                  echo "**Full Changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
                fi
              } > "$notes"
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          gh release create "$tag" "$dmg" \
            --title "$tag" \
            --notes-file "$notes" \
            --latest
